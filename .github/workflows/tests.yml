name: Offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run --locked python -B -m unittest discover -s tests -v
      - name: Check uv commands
        run: |
          uv run --locked scripts/install_skill.py --help
          uv run --locked scripts/endnote_workflow.py --help
          uv run --locked scripts/endnote_workflow.py format --help
          uv run --locked scripts/endnote_workflow.py export examples/records.json --output .test-output/uv-import.xml
      - name: Check Word connection command
        if: runner.os == 'Windows'
        run: uv run --locked scripts/endnote_workflow.py probe
      - name: Parse PowerShell bridge
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/endnote_word.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count) { $parseErrors | Format-List; exit 1 }
